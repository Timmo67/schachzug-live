name: Apps
# Builds the iOS and Android apps (Capacitor) from the web app. The Android debug APK is uploaded as an
# artifact and can be installed on a phone for testing; iOS is a simulator build until signing is set up.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      # Firebase config for push notifications (GitHub secret GOOGLE_SERVICES_JSON); without it the app builds
      # and runs, only push is switched off.
      - name: Firebase config
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ANDROID=1" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: knightcall-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios/App
      # Start the app in the iPhone and iPad simulators and keep screenshots (artifact "iphone-screenshots").
      - name: Simulator screenshots
        working-directory: ios/App
        run: |
          mkdir -p screenshots
          for kind in iPhone iPad; do
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('$kind ') and 'mini' not in x['name']))")
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/App.app
            xcrun simctl launch "$udid" app.knightcall
            sleep 20
            xcrun simctl io "$udid" screenshot "screenshots/$kind-start.png"
            xcrun simctl ui "$udid" appearance dark
            sleep 3
            xcrun simctl io "$udid" screenshot "screenshots/$kind-dark.png"
            xcrun simctl shutdown "$udid"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: ios/App/screenshots
          retention-days: 30
